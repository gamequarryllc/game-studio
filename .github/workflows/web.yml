name: Build and publish playtest builds

# Every push to main builds every game in games/ and every app in apps/ for the
# web and publishes the lot to GitHub Pages: https://gamequarryllc.github.io/game-studio/
# (games at /<slug>/, app previews at /apps/<slug>/).
# One game or app failing doesn't block the others: it is listed as broken in
# status.json and on the index page, and the job is marked failed at the end.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # A game builds with the Godot version in games/<slug>/godot_version.txt, or
  # this one when it has no such file.
  DEFAULT_GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Privacy check (no personal information in a public repo)
        run: python3 tools/privacy_check.py

      - name: Which Godot versions the games need
        id: versions
        run: |
          set -euo pipefail
          vers=""
          for proj in games/*/project.godot; do
            [ -e "$proj" ] || continue
            dir="$(dirname "$proj")"
            v=""
            if [ -f "$dir/godot_version.txt" ]; then v="$(tr -d '[:space:]' < "$dir/godot_version.txt")"; fi
            v="${v:-$DEFAULT_GODOT_VERSION}"
            echo "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "::error::$dir/godot_version.txt: bad version '$v'"; exit 1; }
            vers="$vers $v"
          done
          list="$(echo $vers | tr ' ' '\n' | sort -u | paste -sd' ' -)"
          echo "Godot versions: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "key=$(echo "$list" | tr ' ' '+')" >> "$GITHUB_OUTPUT"

      - name: Restore Godot from cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          # One cache holds every version in use; when a game moves to a new one,
          # the older cache is restored and only the new version is downloaded.
          key: godot-web-${{ steps.versions.outputs.key }}-v2
          restore-keys: |
            godot-web-

      - name: Download any missing Godot version and its web export templates
        env:
          VERSIONS: ${{ steps.versions.outputs.list }}
        run: |
          set -euo pipefail
          for v in $VERSIONS; do
            bin="$HOME/godot/$v/godot"
            templates="$HOME/.local/share/godot/export_templates/${v}.stable"
            if [ -x "$bin" ] && [ -s "$templates/web_nothreads_release.zip" ]; then
              echo "Godot $v: cached"; continue
            fi
            echo "Godot $v: downloading"
            base="https://github.com/godotengine/godot/releases/download/${v}-stable"
            mkdir -p "$HOME/godot/$v" "$templates"
            curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${v}-stable_linux.x86_64.zip"
            rm -rf /tmp/godot-unzip
            unzip -q /tmp/godot.zip -d /tmp/godot-unzip
            mv "/tmp/godot-unzip/Godot_v${v}-stable_linux.x86_64" "$bin"
            # The full template pack is over 1 GB; keep only the web templates.
            curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${v}-stable_export_templates.tpz"
            unzip -q -o -j /tmp/templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$templates"
            rm -rf /tmp/godot.zip /tmp/godot-unzip /tmp/templates.tpz
          done

      - name: Build every game
        run: |
          set -uo pipefail
          site="$GITHUB_WORKSPACE/build/site"
          mkdir -p "$site"
          : > "$GITHUB_WORKSPACE/build/results.txt"
          for proj in games/*/project.godot; do
            [ -e "$proj" ] || continue
            dir="$(dirname "$proj")"; slug="$(basename "$dir")"
            ver=""
            if [ -f "$dir/godot_version.txt" ]; then ver="$(tr -d '[:space:]' < "$dir/godot_version.txt")"; fi
            ver="${ver:-$DEFAULT_GODOT_VERSION}"
            godot="$HOME/godot/$ver/godot"
            echo "::group::$slug (Godot $ver)"
            if (
              set -e
              cd "$dir"
              timeout 300 "$godot" --headless --import
              if [ -f tests/smoke_test.gd ]; then
                timeout 300 "$godot" --headless -s res://tests/smoke_test.gd
              fi
              if [ -f tests/monetization_test.gd ]; then
                timeout 120 "$godot" --headless -s res://tests/monetization_test.gd
              fi
              if [ -f tests/playthrough.gd ]; then
                timeout 900 "$godot" --headless --fixed-fps 20 -s res://tests/playthrough.gd -- boosted
              fi
              mkdir -p "$site/$slug"
              timeout 600 "$godot" --headless --export-release "Web" "$site/$slug/index.html"
              test -s "$site/$slug/index.wasm"
            ); then
              echo "$slug ok" >> "$GITHUB_WORKSPACE/build/results.txt"
            else
              echo "::error title=$slug::build or smoke test failed"
              echo "$slug failed" >> "$GITHUB_WORKSPACE/build/results.txt"
              rm -rf "$site/$slug"
            fi
            echo "::endgroup::"
          done
          cat "$GITHUB_WORKSPACE/build/results.txt"

      # The apps (Expo projects in apps/<slug>/) are checked and exported after
      # the games, so a broken app can never stop a game from being published.
      - name: Set up Node for the apps
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/*/package-lock.json

      - name: Build every app
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          set -uo pipefail
          site="$GITHUB_WORKSPACE/build/site"
          mkdir -p "$site/apps"
          touch "$GITHUB_WORKSPACE/build/results.txt"
          # The site lives under /<repository name>/ on GitHub Pages.
          base="/${GITHUB_REPOSITORY#*/}"
          for pkg in apps/*/package.json; do
            [ -e "$pkg" ] || continue
            dir="$(dirname "$pkg")"; slug="$(basename "$dir")"
            echo "::group::$slug (app)"
            if (
              set -e
              cd "$dir"
              npm ci --no-audit --no-fund
              npm run lint
              npm run typecheck
              npm test
              # The iPhone bundle: nothing is published from it, but it is the only
              # step that compiles the files the web preview never loads.
              npx expo export --platform ios --output-dir dist-ios
              APP_BASE_URL="$base/apps/$slug" npx expo export --platform web
              test -s dist/index.html
              rm -rf "$site/apps/$slug"
              cp -r dist "$site/apps/$slug"
            ); then
              echo "apps/$slug ok" >> "$GITHUB_WORKSPACE/build/results.txt"
            else
              echo "::error title=$slug::app lint, typecheck, tests, iPhone bundle or web export failed"
              echo "apps/$slug failed" >> "$GITHUB_WORKSPACE/build/results.txt"
              rm -rf "$site/apps/$slug"
            fi
            echo "::endgroup::"
          done
          cat "$GITHUB_WORKSPACE/build/results.txt"

      - name: Make the index, privacy policy and support pages
        env:
          # The studio's public contact address for the privacy and support pages.
          # It is kept out of the repo: a repository variable (Settings > Secrets
          # and variables > Actions > Variables). Without it the pages point at
          # the issue page (tools/site_pages.py).
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: python3 tools/build_site.py build/site build/results.txt

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Fail the run if any game or app broke
        run: "! grep -q ' failed$' build/results.txt"

      # After the upload, so a slip in a store listing never takes the play links down.
      - name: Store listings and site pages check
        if: ${{ !cancelled() }}
        run: python3 tools/store_check.py

  deploy:
    needs: build
    # Publish the games that did build even when another one broke.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
