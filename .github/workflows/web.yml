name: Build and publish playtest builds

# Every push to main builds every game in games/ for the web and publishes the
# lot to GitHub Pages: https://gamequarryllc.github.io/game-studio/
# One game failing doesn't block the others: it is listed as broken in
# status.json and on the index page, and the job is marked failed at the end.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Privacy check (no personal information in a public repo)
        run: python3 tools/privacy_check.py

      - name: Restore Godot from cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Download Godot and the web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates"
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-unzip
          mv "/tmp/godot-unzip/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          # The full template pack is 1.2 GB; keep only the web templates.
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$templates"
          rm -rf /tmp/godot.zip /tmp/godot-unzip /tmp/templates.tpz

      - name: Build every game
        run: |
          set -uo pipefail
          site="$GITHUB_WORKSPACE/build/site"
          mkdir -p "$site"
          : > "$GITHUB_WORKSPACE/build/results.txt"
          for proj in games/*/project.godot; do
            [ -e "$proj" ] || continue
            dir="$(dirname "$proj")"; slug="$(basename "$dir")"
            echo "::group::$slug"
            if (
              set -e
              cd "$dir"
              timeout 300 ~/godot/godot --headless --import
              if [ -f tests/smoke_test.gd ]; then
                timeout 300 ~/godot/godot --headless -s res://tests/smoke_test.gd
              fi
              mkdir -p "$site/$slug"
              timeout 600 ~/godot/godot --headless --export-release "Web" "$site/$slug/index.html"
              test -s "$site/$slug/index.wasm"
            ); then
              echo "$slug ok" >> "$GITHUB_WORKSPACE/build/results.txt"
            else
              echo "::error title=$slug::build or smoke test failed"
              echo "$slug failed" >> "$GITHUB_WORKSPACE/build/results.txt"
              rm -rf "$site/$slug"
            fi
            echo "::endgroup::"
          done
          cat "$GITHUB_WORKSPACE/build/results.txt"

      - name: Make the index page
        run: python3 tools/build_site.py build/site build/results.txt

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Fail the run if any game broke
        run: "! grep -q ' failed$' build/results.txt"

  deploy:
    needs: build
    # Publish the games that did build even when another one broke.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
