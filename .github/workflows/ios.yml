name: iOS build

# Builds games for iPhone and iPad on a Mac runner (Godot iOS builds need macOS).
#
#   check       Unsigned build. Needs no Apple account. Proves a game compiles and
#               packages for iOS. Runs for every game when the pipeline itself changes,
#               and on request for one game.
#   testflight  Signs with the owner's App Store Connect API key and uploads the build
#               to TestFlight. Only ever started by hand (Actions > iOS build > Run workflow).
#
# Each game builds with the Godot version in games/<slug>/godot_version.txt (4.4.1
# when there is none). Games with native ad and store plugins get their iOS halves
# from tools/fetch_plugins.sh (pinned in tools/plugin_versions.env).
#
# Nothing here submits an app for review; that stays a manual step in App Store Connect.
# Secrets (the owner adds them; see STUDIO.md, "App Store pipeline"):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game folder name in games/, e.g. burn-down-a-forest"
        required: true
        type: string
      mode:
        description: "check = unsigned test build; testflight = sign and upload"
        required: true
        type: choice
        options: [check, testflight]
        default: check
      flavor:
        description: "playtest = developer tools and pretend ads (for trying on a phone); release = App Store build"
        required: true
        type: choice
        options: [playtest, release]
        default: playtest
      version:
        description: "Version shown on the App Store"
        required: true
        type: string
        default: "1.0.0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "tools/ios_build.sh"
      - "tools/ios_preset.py"
      - "tools/fetch_plugins.sh"
      - "tools/plugin_versions.env"
      - "store/*/ios.json"
      - "games/*/godot_version.txt"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ inputs.game || 'all' }}
  cancel-in-progress: true

env:
  DEFAULT_GODOT_VERSION: "4.4.1"   # for a game without games/<slug>/godot_version.txt

jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      games: ${{ steps.pick.outputs.games }}
      mode: ${{ steps.pick.outputs.mode }}
      version: ${{ steps.pick.outputs.version }}
      flavor: ${{ steps.pick.outputs.flavor }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Privacy check (no personal information in a public repo)
        run: python3 tools/privacy_check.py

      - name: Pick the games and the mode
        id: pick
        env:
          IN_GAME: ${{ inputs.game }}
          IN_MODE: ${{ inputs.mode }}
          IN_VERSION: ${{ inputs.version }}
          IN_FLAVOR: ${{ inputs.flavor }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$IN_GAME" in *[!a-z0-9-]*|"") echo "::error::Bad game name"; exit 1;; esac
            [ -f "games/$IN_GAME/project.godot" ] || { echo "::error::No game at games/$IN_GAME"; exit 1; }
            case "$IN_MODE" in check|testflight) ;; *) echo "::error::Bad mode"; exit 1;; esac
            echo "$IN_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "::error::Version must look like 1.0.0"; exit 1; }
            case "$IN_FLAVOR" in playtest|release) ;; *) echo "::error::Bad flavor"; exit 1;; esac
            games="[\"$IN_GAME\"]"; mode="$IN_MODE"; version="$IN_VERSION"; flavor="$IN_FLAVOR"
          else
            # The pipeline changed: check-build every game.
            games="$(ls games/*/project.godot | sed -E 's#games/([^/]+)/project.godot#"\1"#' | paste -sd, -)"
            games="[$games]"; mode="check"; version="1.0.0"; flavor="release"
          fi
          echo "games=$games" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "Building $games in $mode mode ($flavor)"

  build:
    needs: pick
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.pick.outputs.games) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Godot version for ${{ matrix.game }}
        id: ver
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          v=""
          if [ -f "games/$GAME/godot_version.txt" ]; then v="$(tr -d '[:space:]' < "games/$GAME/godot_version.txt")"; fi
          v="${v:-$DEFAULT_GODOT_VERSION}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "::error::games/$GAME/godot_version.txt: bad version '$v'"; exit 1; }
          echo "Godot $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Restore Godot from cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ steps.ver.outputs.version }}-ios-v1

      - name: Restore the native plugins from cache
        if: hashFiles(format('games/{0}/addons/godotx_revenue_cat/plugin.cfg', matrix.game), format('games/{0}/addons/admob/plugin.cfg', matrix.game)) != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/game-studio-plugins
          key: plugins-${{ steps.ver.outputs.version }}-${{ hashFiles('tools/plugin_versions.env') }}-v1

      - name: Download Godot and the iOS export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GODOT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          # The full template pack is 1.2 GB; keep only the iOS template.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/ios.zip' 'templates/version.txt' -d "$templates"
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: Use the newest released Xcode on the runner
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|candidate|_rc' | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build ${{ matrix.game }} (${{ needs.pick.outputs.mode }})
        env:
          GAME: ${{ matrix.game }}
          MODE: ${{ needs.pick.outputs.mode }}
          VERSION: ${{ needs.pick.outputs.version }}
          FLAVOR: ${{ needs.pick.outputs.flavor }}
          BUILD_NUMBER: ${{ github.run_number }}
          WORK: ${{ runner.temp }}/ios
          ASC_KEY_ID: ${{ needs.pick.outputs.mode == 'testflight' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ needs.pick.outputs.mode == 'testflight' && secrets.ASC_ISSUER_ID || '' }}
          ASC_KEY_P8: ${{ needs.pick.outputs.mode == 'testflight' && secrets.ASC_KEY_P8 || '' }}
          APPLE_TEAM_ID: ${{ needs.pick.outputs.mode == 'testflight' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          export GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --version
          bash tools/ios_build.sh "$GAME" "$MODE" 2>&1 | tee "$RUNNER_TEMP/ios_build.txt"
          {
            echo "### $GAME ($MODE)"
            echo '```'
            grep -E '^(name on|bundle id|orientations|architectures|size|AdMob:|RevenueCat:|Release check|  - |== OK)' "$RUNNER_TEMP/ios_build.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build logs when something fails
        if: failure() && needs.pick.outputs.mode == 'check'
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs-${{ matrix.game }}
          path: ${{ runner.temp }}/ios/logs
          retention-days: 7
