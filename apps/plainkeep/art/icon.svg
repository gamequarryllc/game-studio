<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Plainkeep's icon: a service tag whose face is a steel rule. The marks
       stand on one baseline, evenly spaced, every fourth one taller, as on a
       rule; they are inked up to today, and the red mark is the day the job
       is due. Flat colour: no gradient, no shadow. -->
