  <g transform="translate(512 518) scale(0.93) rotate(-7) translate(-512 -512)">
    <path d="M352 96 H672 L808 258 V928 H216 V258 Z" fill="#F7F8F7"/>
    <circle cx="512" cy="236" r="50" fill="#1D4F7C"/>
    <rect x="286.0" y="540" width="28" height="260" fill="#1D4F7C"/>
    <rect x="339.0" y="650" width="28" height="150" fill="#1D4F7C"/>
    <rect x="392.0" y="650" width="28" height="150" fill="#1D4F7C"/>
    <rect x="445.0" y="650" width="28" height="150" fill="#1D4F7C"/>
    <rect x="498.0" y="540" width="28" height="260" fill="#1D4F7C"/>
    <rect x="551.0" y="650" width="28" height="150" fill="#1D4F7C"/>
    <rect x="604.0" y="650" width="28" height="150" fill="#B4BDB9"/>
    <rect x="657.0" y="650" width="28" height="150" fill="#B4BDB9"/>
    <rect x="710.0" y="400" width="28" height="400" fill="#C8401F"/>
