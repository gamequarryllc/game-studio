<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Plainkeep's icon: one service tag on enamel blue. Its marks are the rule
       every job has in the app: inked up to today, and the tall red one is the
       day the job falls due. The ring is the hole a tag hangs by, punched: done. -->
  <rect width="1024" height="1024" fill="#1D4F7C"/>
  <g transform="translate(512 512) scale(0.9) rotate(-8) translate(-512 -512)">
    <path d="M356 96 H668 L800 254 V928 H224 V254 Z" fill="#FBFCFB"/>
    <circle cx="512" cy="232" r="50" fill="#1D4F7C"/>
    <g>
      <rect x="298" y="470" width="36" height="170" rx="18" fill="#1D4F7C"/>
      <rect x="364" y="530" width="36" height="110" rx="18" fill="#1D4F7C"/>
      <rect x="430" y="530" width="36" height="110" rx="18" fill="#1D4F7C"/>
      <rect x="496" y="470" width="36" height="170" rx="18" fill="#1D4F7C"/>
      <rect x="562" y="530" width="36" height="110" rx="18" fill="#C4CBC8"/>
      <rect x="628" y="530" width="36" height="110" rx="18" fill="#C4CBC8"/>
      <rect x="694" y="400" width="36" height="240" rx="18" fill="#C8401F"/>
    </g>
    <circle cx="646" cy="786" r="84" fill="#1D4F7C"/>
    <path d="M606 788 L636 818 L690 756" fill="none" stroke="#FBFCFB" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
